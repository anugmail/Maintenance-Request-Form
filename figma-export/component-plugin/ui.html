<style>
  body{font:12px/1.55 -apple-system,"IBM Plex Sans Thai",sans-serif;margin:0;padding:14px;color:#1b1b1b}
  h1{font-size:13px;margin:0 0 3px}
  .warn{background:#fff4e5;border:1px solid #ffd399;border-radius:6px;padding:8px 10px;margin:8px 0;color:#8a5300}
  label{display:block;font-weight:600;margin:9px 0 4px}
  input{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #d5d5d5;border-radius:6px;font:inherit}
  button{margin-top:10px;padding:9px 16px;border:0;border-radius:6px;background:#0d99ff;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{background:#c4c4c4;cursor:default}
  #log{margin-top:11px;padding:9px;background:#f5f5f5;border-radius:6px;white-space:pre-wrap;
       max-height:230px;overflow:auto;font-size:11px;font-family:ui-monospace,Menlo,monospace}
  .ok{color:#0a7c42}.err{color:#c4320a}
</style>
<h1>สร้างหน้าจอจาก component จริง</h1>
<div class="warn">⚠️ <b>เขียนของลงไฟล์</b> — สร้างหน้าใหม่ "📄 …" ไม่แตะหน้าอื่น ·
<b>รันในไฟล์ที่ duplicate แล้วเท่านั้น</b></div>
<label>สเปก (ต้องรัน <code>node figma-export/serve.js</code> ค้างไว้)</label>
<input id="url" value="http://localhost:8124/spec-components.json" spellcheck="false">
<button id="go">โหลด + สร้าง</button>
<div id="log">พร้อมแล้ว</div>
<script>
var log=document.getElementById('log'), go=document.getElementById('go'), lines=[];
function put(t,cls){ lines.push(cls?'<span class="'+cls+'">'+t+'</span>':t);
  if(lines.length>60) lines.shift(); log.innerHTML=lines.join('\n'); log.scrollTop=log.scrollHeight; }
go.onclick=async function(){
  go.disabled=true; lines=[]; put('โหลดสเปก…');
  try{
    var res=await fetch(document.getElementById('url').value.trim(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    var spec=await res.json();
    if(spec.version!==3) throw new Error('สเปกเวอร์ชัน '+spec.version+' — ต้องเป็น 3');
    put('ได้สเปก '+spec.screens.length+' หน้าจอ');
    parent.postMessage({pluginMessage:{type:'build',spec:spec}},'*');
  }catch(e){ put('โหลดไม่ได้: '+e.message,'err');
    put('  เช็คว่ารัน serve.js อยู่ไหม และรัน 7-map-components.js แล้วหรือยัง','err'); go.disabled=false; }
};
onmessage=function(e){ var m=e.data&&e.data.pluginMessage; if(!m) return;
  if(m.type==='done'){ go.disabled=false; return; } put(m.text,m.cls); };
</script>
