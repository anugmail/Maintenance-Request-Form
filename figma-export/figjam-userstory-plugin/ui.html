<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; margin: 12px; font-size: 12px; color: #111; }
  h2 { font-size: 13px; margin: 0 0 8px; }
  .box { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-bottom: 10px; background: #fafafa; }
  .sel { font-size: 11px; color: #555; white-space: pre-wrap; max-height: 70px; overflow: auto; }
  button { width: 100%; padding: 8px; margin: 4px 0; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; font-size: 12px; }
  button.primary { background: #18a0fb; color: #fff; border-color: #18a0fb; font-weight: 600; }
  button.danger { background: #fff; color: #c0392b; border-color: #c0392b; }
  select { width: 100%; padding: 6px; margin: 4px 0; border-radius: 6px; border: 1px solid #ccc; }
  #result { margin-top: 8px; font-size: 11px; white-space: pre-wrap; padding: 8px; border-radius: 6px; }
  #result.ok { background: #e8f8ee; color: #1a7a3f; }
  #result.err { background: #fdecea; color: #a4231f; }
  details summary { cursor: pointer; font-size: 11px; color: #555; margin-top: 6px; }
  hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
</style>
</head>
<body>
  <h2>แปะ User Story — Overhaul (overhaul-flow-2)</h2>
  <div class="box">
    <div><b>เฟรมที่เลือก:</b></div>
    <div id="selection" class="sel">(ยังไม่ได้เลือก)</div>
  </div>

  <button class="primary" id="btn-auto">แปะ user story ตามเฟรมที่เลือก (อัตโนมัติ)</button>
  <button class="danger" id="btn-clear">ล้างป้ายที่แปะไว้</button>

  <details>
    <summary>เลือก flow เอง (กรณีหาตัวอักษรนำหน้าเฟรมไม่เจอ)</summary>
    <select id="flow-select"></select>
    <button id="btn-manual">แปะ user story ที่เลือกจาก dropdown</button>
  </details>

  <div id="result"></div>

  <script>
    const selEl = document.getElementById('selection');
    const resultEl = document.getElementById('result');
    const flowSelect = document.getElementById('flow-select');

    function showResult(ok, text) {
      resultEl.textContent = text;
      resultEl.className = ok ? 'ok' : 'err';
    }

    window.onmessage = (e) => {
      const msg = e.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'selection') {
        selEl.textContent = msg.names && msg.names.length ? msg.names.join('\n') : '(ยังไม่ได้เลือก)';
      }
      if (msg.type === 'flows') {
        flowSelect.innerHTML = msg.keys.map((k) => '<option value="' + k + '">' + k + '</option>').join('');
      }
      if (msg.type === 'result') {
        showResult(msg.ok, msg.text);
      }
    };

    document.getElementById('btn-auto').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'annotate-auto' } }, '*');
    };
    document.getElementById('btn-clear').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'clear' } }, '*');
    };
    document.getElementById('btn-manual').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'annotate', flow: flowSelect.value } }, '*');
    };

    parent.postMessage({ pluginMessage: { type: 'list' } }, '*');
  </script>
</body>
</html>
