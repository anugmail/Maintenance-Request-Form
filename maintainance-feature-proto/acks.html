<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลการบำรุงรักษารอรับทราบ | Maintain-D (Prototype)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261104-ds74">
<link rel="stylesheet" href="../design-system/components.css?v=20261118-ds75">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../design-system/tailwind-theme.js?v=20261019-ds72"></script>
<!--
  Prototype Feature งานบำรุงรักษารายคัน — ผลการบำรุงรักษารอรับทราบ ฝั่งผู้ดูแลยานพาหนะ (จอ L.1 · L.4)
  ต้นแบบหน้าตา = จอ Figma "MF / H6.2 … หน้าผลการบำรุงรักษารอรับทราบ" (node 195:883810) ไฟล์ Untitled D0ahPEpyZtZ09gnnrcv4sU
  ที่มา · ไฟล์ Component: Page header (Breadcrumbs) · Table header (ค้นหา + Secondary ตัวกรอง) · Table (.tbl.striped) · Pill outline · Table pagination · Empty state
        · ไฟล์ UI Release#2: หน้า "5.1 Rental Contract Management" เฟรม `Contract list`
  ไม่มีบล็อกสไตล์ในหน้า · layout ใช้ Tailwind utility
-->
</head>
<body>
<div class="shell">
  <aside class="side wide" id="side"></aside>
  <div class="work">
    <div class="topbar"></div>
    <main class="content">
      <div class="crumbs"><a href="index.html" aria-label="หน้าแรก"><span class="ms">home</span></a><span class="sep"></span><span class="cur">บำรุงรักษาตามวาระ</span></div>
      <div class="page-title-row"><h1 class="page-title mb-0">ผลการบำรุงรักษารอรับทราบ</h1></div>
      <div class="w-full stack">
        <div class="list-toolbar split mb-0"><div class="lt-search max-w-[320px]"><div class="search"><span class="ms">search</span><input type="search" id="q" placeholder="ค้นหาทะเบียน, แผนเดินทาง" aria-label="ค้นหา"></div></div>
          <div class="lt-actions"><button class="btn btn-s" type="button" id="fbtn"><span class="ms">filter_list</span>ตัวกรอง</button></div></div>
        <div class="tblwrap mt-0" id="wrap"><table class="tbl striped"><thead><tr><th class="w-[200px]">ทะเบียน</th><th class="w-[150px]">วันดำเนินการ</th><th class="w-[160px]">ผู้ดำเนินการ</th><th>แผนเดินทาง</th><th class="w-[150px]">สถานะ</th><th class="w-[60px]" aria-label="ดู"></th></tr></thead><tbody id="body"></tbody></table><div id="foot"></div></div>
        <div class="hidden" id="empty"></div>
      </div>
    </main>
  </div>
</div>
<script src="proto.js?v=20261119-1"></script>
<script>
const S = mfpLoad();
shell(S, 'acks');
function render() {
  const q = $('q').value.trim().toLowerCase(), rows = [];
  (S.trips || []).forEach(t => t.cars.forEach(i => { const j = (S.jobs || {})[jobKey(t, i)]; if (j && j.st === 'done' && carInfo(t, i).ctrl === ROLES.owner[0]) rows.push([t, i, j]); }));
  const list = rows.filter(([t, i]) => !q || (POOL[i][0] + t.name).toLowerCase().includes(q));
  $('body').innerHTML = list.map(([t, i, j]) => `<tr><td><a href="ack.html?trip=${t.id}&car=${i}">${esc(POOL[i][0])}</a><div class="text-xs text-gray-500">${typeOf(POOL[i])}</div></td>
    <td>${(j.closed || '').split(' ')[0]}</td><td>${CREATOR}<div class="text-xs text-gray-500">กบผ.</div></td>
    <td><div class="truncate max-w-[260px]">${esc(t.name)}</div><div class="text-xs text-gray-500">${esc(t.plan)}</div></td>
    <td>${j.ack ? pill('รับทราบแล้ว', 'b-ok') : pill('รอรับทราบ', 'b-low')}</td>
    <td class="dt-action"><a class="btn btn-t btn-icon !no-underline" href="ack.html?trip=${t.id}&car=${i}" aria-label="ดู ${esc(POOL[i][0])}"><span class="ms">chevron_right</span></a></td></tr>`).join('');
  $('foot').innerHTML = pager(list.length, list.length ? 1 : 0, list.length, 1, 0);
  $('wrap').classList.toggle('hidden', !list.length); $('empty').classList.toggle('hidden', !!list.length);
  $('empty').innerHTML = emptyState('data-empty', 'ไม่มีผลการบำรุงรักษารอรับทราบ', 'เมื่อหน่วยงานผู้ดำเนินการปิดงานยานพาหนะที่คุณดูแล รายการจะแสดงที่นี่');
}
$('q').addEventListener('input', render);
$('fbtn').addEventListener('click', () => notify('ตัวกรอง', { sub: 'ไม่อยู่ใน Happy flow — Prototype รอบนี้ยังไม่เปิด' }));
render();
</script>
</body>
</html>
