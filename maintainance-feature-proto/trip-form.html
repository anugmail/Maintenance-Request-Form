<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างแผนเดินทาง | Maintain-D (Prototype)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261104-ds74">
<link rel="stylesheet" href="../design-system/components.css?v=20261118-ds75">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../design-system/tailwind-theme.js?v=20261019-ds72"></script>
<!--
  Prototype Feature แผนเดินทาง — ฟอร์มสร้าง/แก้ไขแผนเดินทาง (จอ E.4 · E.10 · E.5 · E.6 · E.12 · E.17 · H.1 · H.2 · H.3 · H.6)
  ต้นแบบหน้าตา = จอ Figma "MF / H1.4 – H1.8 … หน้าสร้างแผนเดินทาง" (node 195:657888 · 195:663027) และ "MF / H5.2 เลือกผู้รับจ้าง" (195:730943) ไฟล์ Untitled D0ahPEpyZtZ09gnnrcv4sU
  เนื้อหา: tripForm() · tripCarModal() · tripCarEdit() · TRIP_V_COLS · VENDORS · STAFF_INFO ของ base/screens.js
  ที่มา · ไฟล์ Component: Page header (Breadcrumbs) · Section header (.sect Divider ปิด) + Badge · Text input · Horizontal radio groups (.rads) ·
           Input dropdown + Dropdown list item (.combo ผู้รับจ้าง) · Date picker (ช่องวันที่) · Table + Action icons · Empty state/Data empty ·
           Modal (เพิ่มยานพาหนะ · แก้ไขรายคัน) · Notification · Secondary/Primary button Size=lg
        · ไฟล์ UI Release#2: หน้า "5.2 Vehicle Management" (ตารางติ๊กเลือก) · หน้า "5.1 Rental Contract Management" เฟรม `Create contract`
  ไม่มีบล็อกสไตล์ในหน้า · layout ใช้ Tailwind utility
-->
</head>
<body>
<div class="shell">
  <aside class="side wide" id="side"></aside>
  <div class="work">
    <div class="topbar"></div>
    <main class="content">
      <div class="crumbs" id="crumbs"></div>
      <div class="page-title-row"><h1 class="page-title mb-0" id="title"></h1></div>

      <div class="flex flex-col gap-8">
        <div class="note note-warn hidden" id="returned"><span class="ms">undo</span><div><b>ผู้อนุมัติส่งกลับให้แก้ไข</b><div id="reason"></div></div></div>
        <section>
          <div class="sect border-b-0 pb-0">ข้อมูลแผนเดินทาง</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="f mb-0"><label for="name">ชื่อแผนเดินทาง</label><div class="in noic"><input type="text" id="name" placeholder="ระบุชื่อแผนเดินทาง"></div><div class="help hidden" id="name-err">กรุณาระบุชื่อแผนเดินทาง</div></div>
            <div class="f mb-0"><label>รูปแบบดำเนินการ</label><div class="rads" id="mode">
              <label><input type="radio" name="mode" value="self"> ดำเนินการเอง</label><label><input type="radio" name="mode" value="hire"> จ้างดำเนินการ</label></div></div>
          </div>
        </section>

        <section class="hidden" id="hire-sec">
          <div class="sect border-b-0 pb-0">ผู้รับจ้าง</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="f combo mb-0" id="vendor-f"><label for="vendor">ผู้รับจ้าง</label>
              <div class="in"><span class="ms">search</span><input type="text" id="vendor" placeholder="ค้นหาชื่อผู้รับจ้าง" autocomplete="off"><span class="ms combo-arrow">keyboard_arrow_down</span></div>
              <div class="combo-list" hidden></div><div class="help hidden" id="vendor-err">กรุณาเลือกผู้รับจ้าง</div></div>
            <div class="f mb-0"><label for="contract">เลขที่สัญญา/ใบสั่งจ้าง <small>(ถ้ามี)</small></label><div class="in noic"><input type="text" id="contract" placeholder="ระบุเลขที่สัญญาหรือใบสั่งจ้าง"></div></div>
          </div>
        </section>

        <section>
          <div class="sect border-b-0 pb-0" id="range-t">ช่วงวันเดินทาง</div>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="f mb-0"><label for="d1" id="d1-l">วันที่เดินทาง ตั้งแต่</label><div class="in noic"><input type="date" id="d1"></div></div>
            <div class="f mb-0"><label for="d2">ถึงวันที่</label><div class="in noic"><input type="date" id="d2"></div></div>
          </div>
        </section>

        <section id="staff-sec">
          <div class="sect border-b-0 pb-0">พนักงานที่เดินทาง</div>
          <div class="stack" id="staff"></div>
          <button class="btn btn-s w-full mt-4" type="button" id="add-staff"><span class="ms">add</span>เพิ่มพนักงาน</button>
        </section>

        <section>
          <div class="sect border-b-0 pb-0"><span>ยานพาหนะในแผนเดินทาง</span><span class="badge sq" id="n-car"></span>
            <button class="btn btn-s ml-auto" type="button" id="add-car"><span class="ms">add</span>เพิ่มยานพาหนะ</button></div>
          <div id="cars"></div>
        </section>

        <section>
          <div class="sect border-b-0 pb-0">อะไหล่ของแผนเดินทาง</div>
          <div id="parts"></div>
        </section>

        <div class="flex items-center justify-between gap-3">
          <a class="btn btn-s btn-lg !no-underline" id="back">ย้อนกลับ</a>
          <button class="btn btn-p btn-lg ml-auto" type="button" id="save"></button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- เพิ่มยานพาหนะเข้าแผนเดินทาง (E.5) — ยานพาหนะทุกคันของไตรมาส · คันที่อยู่ในแผนเดินทางอื่นเลือกไม่ได้ -->
<div class="modal-overlay hidden" id="m-pick">
  <div class="modal xl" role="dialog" aria-modal="true" aria-labelledby="m-pick-t">
    <div class="modal-hd"><div class="modal-hd-c"><div class="flex-1 min-w-0"><h2 id="m-pick-t">เพิ่มยานพาหนะเข้าแผนเดินทาง</h2><div class="modal-sub" id="m-pick-s"></div></div>
      <button class="modal-x" type="button" data-close="m-pick" aria-label="ปิด"><span class="ms">close</span></button></div></div>
    <div class="modal-bd"><div class="tblwrap mt-0"><table class="tbl striped"><thead><tr><th class="w-[176px]">ทะเบียน</th><th>ยี่ห้อ/รุ่น</th><th class="w-[200px]">หน่วยงานเจ้าของยานพาหนะ</th><th class="w-[220px]">แผนเดินทาง</th></tr></thead><tbody id="pick-body"></tbody></table></div></div>
    <div class="modal-ft"><div class="modal-ft-a"><div class="modal-ft-r">
      <button class="btn btn-s" type="button" data-close="m-pick">ยกเลิก</button>
      <button class="btn btn-p" type="button" id="pick-ok" disabled>เพิ่มเข้าแผนเดินทาง</button>
    </div></div></div>
  </div>
</div>
<!-- แก้ไขยานพาหนะในแผนเดินทาง — ผู้ดูแลยานพาหนะ · สถานที่ · วันดำเนินการ (ภายในช่วงวันของแผน) -->
<div class="modal-overlay hidden" id="m-edit">
  <div class="modal md" role="dialog" aria-modal="true" aria-labelledby="m-edit-t">
    <div class="modal-hd"><div class="modal-hd-c"><h2 id="m-edit-t"></h2>
      <button class="modal-x" type="button" data-close="m-edit" aria-label="ปิด"><span class="ms">close</span></button></div></div>
    <div class="modal-bd"><div class="grid grid-cols-2 gap-6">
      <div class="f mb-0"><label for="e-ctrl">ผู้ดูแลยานพาหนะ</label><div class="in noic"><input type="text" id="e-ctrl"></div></div>
      <div class="f mb-0"><label for="e-tel">เบอร์โทร</label><div class="in noic"><input type="tel" id="e-tel"></div></div>
      <div class="f mb-0 col-span-2"><label for="e-loc">สถานที่บำรุงรักษา</label><div class="in noic"><input type="text" id="e-loc"></div></div>
      <div class="f mb-0"><label for="e-w1">วันดำเนินการ ตั้งแต่</label><div class="in noic"><input type="date" id="e-w1"></div></div>
      <div class="f mb-0"><label for="e-w2">ถึงวันที่</label><div class="in noic"><input type="date" id="e-w2"></div></div>
    </div></div>
    <div class="modal-ft"><div class="modal-ft-a"><div class="modal-ft-r">
      <button class="btn btn-s" type="button" data-close="m-edit">ยกเลิก</button>
      <button class="btn btn-p" type="button" id="e-ok">บันทึก</button>
    </div></div></div>
  </div>
</div>

<script src="proto.js?v=20261119-1"></script>
<script>
const S = mfpLoad();
shell(S, 'plans');
const qs = new URLSearchParams(location.search);
const p = S.plans.find(x => x.id === qs.get('plan')), q = +(qs.get('q') || 1);
if (!p) location.href = 'plans.html';
S.trips = S.trips || [];
const src = qs.get('trip') && S.trips.find(t => t.id === qs.get('trip'));
const T = src ? JSON.parse(JSON.stringify(src)) : { id: 'T' + Date.now(), plan: p.id, q, name: '', mode: 'self', vendor: '', contract: '', d1: '', d2: '', staff: [-1, -1], cars: [], edits: {}, status: 'review' };
const back = `quarter.html?plan=${p.id}&q=${q}`;
$('back').href = back;
const head = src ? 'แก้ไขแผนเดินทาง' : 'สร้างแผนเดินทาง';
$('crumbs').innerHTML = `<a href="index.html" aria-label="หน้าแรก"><span class="ms">home</span></a><span class="sep"></span><a href="plans.html">บำรุงรักษาตามวาระ</a><span class="sep"></span><a href="plan-detail.html?id=${p.id}">${esc(p.name)}</a><span class="sep"></span><a href="${back}">ไตรมาส ${q}</a><span class="sep"></span><span class="cur">${head}</span>`;
$('title').textContent = head + ' · ไตรมาส ' + q; document.title = head + ' | Maintain-D (Prototype)';
$('save').textContent = src ? 'ส่งอนุมัติใหม่' : 'ยืนยันการสร้างแผนเดินทาง';
if (src && src.status === 'returned') { $('returned').classList.remove('hidden'); $('reason').textContent = src.reason || ''; }
$('name').value = T.name; $('contract').value = T.contract; $('d1').value = T.d1; $('d2').value = T.d2;

/* ผู้รับจ้าง — Search-select (.combo) รายชื่อ VENDORS (บรรทัดรอง = ประเภทยานพาหนะที่รับ) */
const vlist = $('vendor-f').querySelector('.combo-list');
const drawV = () => { const k = $('vendor').value.trim(); const rows = VENDORS.filter(v => !k || v[0].includes(k));
  vlist.innerHTML = rows.length ? rows.map(v => `<button type="button" class="combo-opt${v[0] === T.vendor ? ' sel' : ''}" data-v="${esc(v[0])}"><span class="combo-opt-tx"><b>${esc(v[0])}</b><small>${esc(v[1])}</small></span><span class="ms">check</span></button>`).join('') : '<div class="combo-empty">ไม่พบรายการ</div>'; };
$('vendor').value = T.vendor;
$('vendor').addEventListener('focus', () => { vlist.hidden = false; drawV(); });
$('vendor').addEventListener('input', () => { T.vendor = ''; vlist.hidden = false; drawV(); refresh(); });
$('vendor').addEventListener('blur', () => { vlist.hidden = true; });
vlist.addEventListener('mousedown', e => { const b = e.target.closest('.combo-opt'); if (!b) return; e.preventDefault(); T.vendor = b.dataset.v; $('vendor').value = T.vendor; vlist.hidden = true; $('vendor-err').classList.add('hidden'); refresh(); });

function renderMode() {
  document.querySelectorAll('#mode input').forEach(i => i.checked = i.value === T.mode);
  const hire = T.mode === 'hire';
  $('hire-sec').classList.toggle('hidden', !hire); $('staff-sec').classList.toggle('hidden', hire);
  $('range-t').textContent = hire ? 'ช่วงวันทำงาน' : 'ช่วงวันเดินทาง'; $('d1-l').textContent = hire ? 'วันที่เริ่มงาน' : 'วันที่เดินทาง ตั้งแต่';
}
/* พนักงานที่เดินทาง — ชื่อ-สกุล (เลือกจากรายชื่อพนักงาน) · ตำแหน่ง (แสดงอย่างเดียว) · เบอร์โทร · ลบแถว */
function renderStaff() {
  $('staff').innerHTML = T.staff.map((s, k) => { const st = STAFF[s]; return `<div class="grid grid-cols-[1fr_1fr_1fr_40px] gap-6 items-end">
    <div class="f mb-0"><label for="st-${k}">ชื่อ-สกุล</label><div class="in noic"><select id="st-${k}" data-staff="${k}"><option value="-1">ค้นหาชื่อ-นามสกุล, รหัสพนักงาน</option>${STAFF.map((x, j) => `<option value="${j}"${j === s ? ' selected' : ''}${T.staff.includes(j) && j !== s ? ' disabled' : ''}>${x[0]}</option>`).join('')}</select></div></div>
    <div class="f mb-0"><label>ตำแหน่ง</label><div class="in noic"><input type="text" value="${st ? st[1] : '-'}" readonly></div></div>
    <div class="f mb-0"><label>เบอร์โทร</label><div class="in noic"><input type="tel" value="${st ? st[2] : ''}" placeholder="0XX-XXX-XXXX"></div></div>
    <button class="btn btn-t btn-icon mb-1" type="button" data-unstaff="${k}" aria-label="ลบพนักงาน"><span class="ms">delete</span></button></div>`; }).join('');
  $('add-staff').disabled = T.staff.length >= STAFF.length;
}
function renderCars() {
  $('n-car').textContent = T.cars.length;
  $('cars').innerHTML = T.cars.length ? `<div class="tblwrap mt-0"><table class="tbl striped"><thead><tr>${TRIP_TH}<th class="w-[96px]" aria-label="จัดการ"></th></tr></thead><tbody>${T.cars.map(i => tripRow(T, i,
      `<td class="dt-action"><button class="btn btn-t btn-icon" type="button" data-cedit="${i}" aria-label="แก้ไข ${esc(POOL[i][0])}"><span class="ms">stylus</span></button><button class="btn btn-t btn-icon" type="button" data-cout="${i}" aria-label="เอา ${esc(POOL[i][0])} ออก"><span class="ms">delete</span></button></td>`)).join('')}</tbody></table></div>`
    : emptyState('data-empty', 'ยังไม่มียานพาหนะในแผนเดินทาง', `กดเพิ่มยานพาหนะเพื่อเลือกยานพาหนะของไตรมาส ${q} ที่ยังไม่อยู่ในแผนเดินทางใด`);
  $('parts').innerHTML = partsTable(partsOf(p, T.cars), 'เพิ่มยานพาหนะเข้าแผนเดินทางแล้ว อะไหล่ของยานพาหนะแต่ละคันจะรวมมาที่นี่');
}
/* ยืนยันได้เมื่อกรอกครบ: ชื่อ · ช่วงวัน · ยานพาหนะ ≥ 1 · ดำเนินการเอง = พนักงาน ≥ 1 · จ้าง = ผู้รับจ้าง */
const ready = () => T.name.trim() && T.d1 && T.d2 && T.cars.length && (T.mode === 'hire' ? !!T.vendor : T.staff.some(s => s >= 0));
function refresh() { $('save').disabled = !ready(); }
function render() { renderMode(); renderStaff(); renderCars(); refresh(); }

$('name').addEventListener('input', () => { T.name = $('name').value; $('name-err').classList.add('hidden'); $('name').closest('.f').classList.remove('err'); refresh(); });
$('name').addEventListener('blur', () => { if (!T.name.trim()) { $('name-err').classList.remove('hidden'); $('name').closest('.f').classList.add('err'); } });
$('contract').addEventListener('input', () => { T.contract = $('contract').value; });
['d1', 'd2'].forEach(k => $(k).addEventListener('change', () => { T[k] = $(k).value; if (T.d1 && T.d2 && T.d2 < T.d1) { T.d2 = T.d1; $('d2').value = T.d1; } renderCars(); refresh(); }));
$('mode').addEventListener('change', e => { T.mode = e.target.value; render(); });
$('staff').addEventListener('change', e => { const s = e.target.closest('[data-staff]'); if (s) { T.staff[+s.dataset.staff] = +s.value; renderStaff(); refresh(); } });
$('add-staff').addEventListener('click', () => { T.staff.push(-1); renderStaff(); });

let pickSel = [], editCar = null;
$('add-car').addEventListener('click', () => {
  pickSel = []; $('m-pick-s').textContent = `ยานพาหนะทุกคันของไตรมาส ${q} ที่ยังไม่อยู่ในแผนเดินทางใด`;
  $('pick-body').innerHTML = inQ(p, q).filter(i => !T.cars.includes(i)).map(i => { const o = tripOf(S, p.id, q, i, T.id);
    return `<tr><td><div class="flex items-start gap-3"><input type="checkbox" class="mt-1" data-pick="${i}"${o ? ' disabled' : ''} aria-label="เลือก ${esc(POOL[i][0])}"><div>${plateCell(POOL[i], POOL[i][2], 'max-w-[110px]')}</div></div></td>
      <td>${esc(POOL[i][1])}</td><td>${esc(POOL[i][2])}</td><td>${o ? `<div class="truncate max-w-[200px]">${esc(o.name)}</div><div class="text-xs text-gray-500">อยู่ในแผนเดินทางแล้ว</div>` : '—'}</td></tr>`; }).join('');
  $('pick-ok').disabled = true; $('pick-ok').textContent = 'เพิ่มเข้าแผนเดินทาง'; modal('m-pick', true);
});
$('pick-body').addEventListener('change', e => { const i = +e.target.dataset.pick; pickSel = e.target.checked ? pickSel.concat(i) : pickSel.filter(x => x !== i);
  $('pick-ok').disabled = !pickSel.length; $('pick-ok').textContent = 'เพิ่มเข้าแผนเดินทาง' + (pickSel.length ? ' (' + pickSel.length + ')' : ''); });
$('pick-ok').addEventListener('click', () => { T.cars = T.cars.concat(pickSel); modal('m-pick', false); renderCars(); refresh(); notify(`เพิ่มยานพาหนะ ${pickSel.length} คันเข้าแผนเดินทางแล้ว`); });
document.addEventListener('click', e => {
  const u = e.target.closest('[data-unstaff]'); if (u) { T.staff.splice(+u.dataset.unstaff, 1); renderStaff(); refresh(); }
  const ot = e.target.closest('[data-cout]'); if (ot) { const i = +ot.dataset.cout; T.cars = T.cars.filter(x => x !== i); delete T.edits[i]; renderCars(); refresh(); notify(`เอา ${POOL[i][0]} ออกจากแผนเดินทางแล้ว`); }
  const ed = e.target.closest('[data-cedit]'); if (ed) { editCar = +ed.dataset.cedit; const x = carInfo(T, editCar), w = T.edits[editCar] || {};
    $('m-edit-t').textContent = 'แก้ไขยานพาหนะในแผนเดินทาง · ' + POOL[editCar][0];
    $('e-ctrl').value = x.ctrl; $('e-tel').value = x.tel; $('e-loc').value = x.loc; $('e-w1').value = w.w1 || T.d1; $('e-w2').value = w.w2 || T.d2;
    ['e-w1', 'e-w2'].forEach(k => { $(k).min = T.d1; $(k).max = T.d2; }); modal('m-edit', true); }
});
$('e-ok').addEventListener('click', () => { const i = editCar, d = { ctrl: $('e-ctrl').value.trim(), tel: $('e-tel').value.trim(), loc: $('e-loc').value.trim() };
  const def = carInfo({}, i); const e = {};
  if (d.ctrl && d.ctrl !== def.ctrl) e.ctrl = d.ctrl; if (d.tel && d.tel !== def.tel) e.tel = d.tel; if (d.loc && d.loc !== def.loc) e.loc = d.loc;
  if ($('e-w1').value && ($('e-w1').value !== T.d1 || $('e-w2').value !== T.d2)) { e.w1 = $('e-w1').value; e.w2 = $('e-w2').value || e.w1; }
  T.edits[i] = e; modal('m-edit', false); renderCars(); });
$('save').addEventListener('click', () => {
  if (simFail()) { notify('general error', { err: true, sub: 'ข้อความจริงยังไม่เคาะ' }); return; }
  Object.assign(T, { status: 'review', sentAt: today(), reason: '' }); if (T.mode === 'hire') T.staff = []; else { T.vendor = ''; T.contract = ''; }
  T.staff = T.staff.filter(s => s >= 0);
  S.trips = S.trips.filter(t => t.id !== T.id).concat([T]);
  S.notis = (S.notis || []).concat([{ to: 'approver', text: `แผนเดินทาง ${T.name} รอตรวจสอบ`, at: 'เมื่อสักครู่', isNew: true, href: 'trip-detail.html?id=' + T.id }]);
  mfpSave(S); flash(src ? 'ส่งแผนเดินทางให้ผู้อนุมัติใหม่แล้ว' : 'สร้างแผนเดินทางสำเร็จ · ส่งให้ผู้อนุมัติแล้ว'); location.href = back;
});
render();
</script>
</body>
</html>
