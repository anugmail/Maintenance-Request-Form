<script src="proto.js?v=20261119-1"></script>
<script>
const S = mfpLoad();
shell(S, 'parts-track');
const plans = S.plans.filter(p => ['approved', 'active'].includes(p.status));
let tab = 0, page = 0, F = { plan: '', q: '' };
$('f-plan').innerHTML = '<option value="">ทั้งหมด</option>' + plans.map(p => `<option value="${p.id}">${p.id} · ${esc(p.name)}</option>`).join('');
/* แถวข้อมูลของแต่ละแท็บ — รวมตามรายการ (ชนิด) · แยกรายคัน · ความคืบหน้าของแผน (รายไตรมาส) */
function data() {
  const ps = plans.filter(p => !F.plan || p.id === F.plan);
  const perCar = [];
  ps.forEach(p => carIds(p).filter(i => !F.q || p.cars[i] === +F.q).forEach(i => jobTasks(p, i).forEach(r => perCar.push([POOL[i][0], p.id, p.unit, p.cars[i], r[1], r[4], r[4] === 'OL-0011' ? 'น้ำมัน' : 'ไส้กรอง', r[2], r[3]]))));
  const agg = {}; perCar.forEach(r => { const a = agg[r[5]] || (agg[r[5]] = [r[4], r[5], r[6], 0, r[8]]); a[3] += +r[7]; });
  const prog = []; ps.forEach(p => [1, 2, 3, 4].filter(q => !F.q || q === +F.q).forEach(q => { const cars = inQ(p, q), trips = (S.trips || []).filter(t => t.plan === p.id && t.q === q);
    const done = cars.filter(i => trips.some(t => ((S.jobs || {})[jobKey(t, i)] || {}).st === 'done')).length; prog.push([p.id, p.unit, p.name, q, trips.length, done, cars.length]); }));
  return [Object.values(agg), perCar, prog];
}
function render() {
  const d = data(), labels = ['รวมตามรายการ', 'แยกรายคัน', 'ความคืบหน้าของแผน'];
  $('tabs').innerHTML = labels.map((l, k) => `<button type="button" class="tab-btn${k === tab ? ' on' : ''}" role="tab" data-tab="${k}">${l} <span class="badge b-brand">${d[k].length}</span></button>`).join('');
  $('q').placeholder = ['ค้นหาชื่ออะไหล่, รหัสอะไหล่', 'ค้นหาทะเบียน, ชื่ออะไหล่', 'ค้นหาเลขที่ MR, ชื่อแผน'][tab];
  const k = $('q').value.trim().toLowerCase(), rows = d[tab].filter(r => !k || r.join(' ').toLowerCase().includes(k));
  const pages = Math.max(1, Math.ceil(rows.length / 10)); page = Math.min(page, pages - 1); const view = rows.slice(page * 10, page * 10 + 10);
  $('head').innerHTML = '<tr>' + [[['ชนิด', 0, 1], ['รหัสอะไหล่', 180], ['ประเภท', 180], ['จำนวน', 160], ['หน่วย', 160]],
    [['ทะเบียน', 160, 1], ['เลขที่ MR', 160], ['ไตรมาส', 150], ['ชนิด', 0], ['รหัสอะไหล่', 150], ['ประเภท', 150], ['จำนวน', 140], ['หน่วย', 110]],
    [['เลขที่ MR', 150, 1], ['ชื่อแผน', 0], ['ไตรมาส', 140], ['แผนเดินทาง', 140], ['ยานพาหนะบำรุงรักษาแล้ว', 200], ['สถานะ', 150]]][tab].map(([l, w, f]) => sortTh(l, w, f)).join('') + (tab === 2 ? '<th class="w-[60px]" aria-label="ดู"></th>' : '') + '</tr>';
  $('body').innerHTML = view.map(r => tab === 0 ? `<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`
    : tab === 1 ? `<tr><td><a href="#" data-plate class="whitespace-nowrap">${esc(r[0])}</a></td><td>${r[1]}<div class="text-xs text-gray-500">${r[2]}</div></td><td>ไตรมาส ${r[3]}</td><td><div class="truncate max-w-[180px]">${esc(r[4])}</div></td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td></tr>`
    : `<tr><td>${r[0]}<div class="text-xs text-gray-500">${r[1]}</div></td><td><div class="truncate max-w-[300px]">${esc(r[2])}</div></td><td>ไตรมาส ${r[3]}</td><td>${r[4]} ใบ</td><td>${r[5]}/${r[6]} คัน</td>
      <td>${r[4] ? pill('กำลังดำเนินการ', 'b-info') : pill('ยังไม่เริ่ม', 'b-neutral')}</td><td class="dt-action"><a class="btn btn-t btn-icon !no-underline" href="quarter.html?plan=${r[0]}&q=${r[3]}" aria-label="ไปหน้าไตรมาส"><span class="ms">chevron_right</span></a></td></tr>`).join('');
  $('foot').innerHTML = pager(rows.length, rows.length ? page * 10 + 1 : 0, page * 10 + view.length, pages, page);
  $('wrap').classList.toggle('hidden', !rows.length); $('empty').classList.toggle('hidden', !!rows.length);
  $('empty').innerHTML = emptyState('data-empty', 'ไม่พบข้อมูล', 'ไม่มีรายการที่ตรงกับคำค้นหรือตัวกรอง');
  const chips = []; if (F.plan) chips.push(['plan', F.plan]); if (F.q) chips.push(['q', 'ไตรมาส ' + F.q]);
  $('fchips').innerHTML = chips.map(([k2, t]) => `<span class="fchip">${esc(t)}<button class="fchip-x" type="button" data-rm="${k2}" aria-label="เอาตัวกรอง ${esc(t)} ออก"><span class="ms">close_small</span></button></span>`).join('');
}
$('tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) { tab = +t.dataset.tab; page = 0; $('q').value = ''; render(); } });
$('q').addEventListener('input', () => { page = 0; render(); });
$('foot').addEventListener('click', e => { const b = e.target.closest('[data-pg]'); if (b && !b.disabled) { page = +b.dataset.pg; render(); } });
$('fbtn').addEventListener('click', () => { $('f-plan').value = F.plan; $('f-q').value = F.q; modal('m-f', true); });
$('f-clear').addEventListener('click', () => { $('f-plan').value = ''; $('f-q').value = ''; });
$('f-ok').addEventListener('click', () => { F = { plan: $('f-plan').value, q: $('f-q').value }; page = 0; modal('m-f', false); render(); });
$('fchips').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { F[b.dataset.rm] = ''; render(); } });
$('xbtn').addEventListener('click', () => modal('m-x', true));
$('x-type').addEventListener('change', () => document.querySelectorAll('#x-type .radcard').forEach(l => l.classList.toggle('sel', l.querySelector('input').checked)));
$('x-ok').addEventListener('click', () => { modal('m-x', false); notify('ส่งออกไฟล์สำเร็จ', { sub: 'Prototype — ยังไม่มีไฟล์จริง' }); });   // C.9
render();
</script>
