<script src="overhaul-v2-mock.js?v=20261106-1"></script>
<script src="overhaul-v2-picker.js?v=20261111-3"></script>
<script src="overhaul-v2-plan-cars.js?v=20261111-4"></script>
<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
let S=oh2Load();
const editId=q.get('id');
const plan=editId?S.plans.find(p=>p.id===editId):null;
const backTo=q.get('from')==='detail'&&plan?`overhaul-v2-03-plan-detail.html?id=${plan.id}`:'overhaul-v2-01-plans.html';
const FIELDS=['name','year','budget','wbs','net','act','remark'];

/* ปีงบ — ปีปัจจุบันเป็นค่าตั้งต้น · แผนเดิมที่เป็นปีก่อนหน้า (แก้ไข) ให้เห็นปีเดิมด้วย ไม่เลือกปีอื่นย้อนหลังได้ */
const years=oh2Years(5);
if(plan&&!years.includes(plan.year))years.unshift(plan.year);
$('year').innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');

const docs=plan?JSON.parse(JSON.stringify(plan.docs)):{approve:[],budget:[],other:[]};
/* ส่วนเลือกรถ — แยก pending (หน้าเลือกรถ) ออกจาก draft (ตาราง) · ลง DB พร้อมแผนตอนบันทึก */
const PC=pcInit({mode:'page',plan,root:$('cars-field')});
document.addEventListener('click',e=>{const t=e.target.closest('[data-todo]');if(t)oh2Notify(`${t.dataset.todo} — ยังไม่ได้ทำในรอบตัวอย่างนี้`,{sub:'ยังไม่ยืนยันดีไซน์'})});
if(plan){
  $('title').textContent=`แก้ไขแผน ${plan.id}`;$('crumb').textContent=`แก้ไขแผน ${plan.id}`;document.title=`แก้ไขแผน ${plan.id} | Maintain-D (Mock)`;
  $('name').value=plan.name;$('year').value=plan.year;$('budget').value=oh2Money(plan.budget);
  $('wbs').value=plan.wbs;$('net').value=plan.net;$('act').value=plan.act;$('remark').value=plan.remark||'';
  $('cancel').classList.remove('hidden');
} else if(editId){oh2Notify(`ไม่พบแผน ${editId}`,{err:true});}

const carsSnap=()=>PC.snap();
const snap=()=>JSON.stringify([FIELDS.map(f=>$(f).value.trim()),docs,carsSnap()]);
const start=snap();
const dirty=()=>snap()!==start;
/* ไปหน้าเลือกรถ: ฝากร่างฟอร์ม (ช่อง · เอกสาร · รถ) · กลับมา ?back=1: คืนร่าง + ต่อรถที่เลือก · ยกเลิกมา = คืนร่างอย่างเดียว */
const selfUrl=(extra)=>{const u=new URLSearchParams(location.search);u.delete('back');Object.entries(extra||{}).forEach(([a,b])=>u.set(a,b));return 'overhaul-v2-02-plan-form-r2.html'+(u.toString()?'?'+u:'')};
pcOnLeave=d=>{pkSet(PK_FORM_KEY,{planId:plan?plan.id:null,fields:Object.fromEntries(FIELDS.map(f=>[f,$(f).value])),docs,draft:d});
  location.href='overhaul-v2-02c-vehicle-picker-page.html?'+new URLSearchParams({pool:'base',plan:plan?plan.id:'',ret:selfUrl({back:'1'})})};
(()=>{const saved=pkGet(PK_FORM_KEY);
  if(q.get('back')==='1'&&saved&&saved.planId===(plan?plan.id:null)){
    FIELDS.forEach(f=>{if(saved.fields[f]!=null)$(f).value=saved.fields[f]});
    Object.keys(docs).forEach(x=>docs[x].splice(0,docs[x].length,...(saved.docs[x]||[])));
    PC.setDraft(saved.draft);const res=pkGet(PK_RESULT_KEY);if(res&&res.length)PC.addIds(res);
    history.replaceState(null,'',selfUrl());
  }
  pkSet(PK_FORM_KEY,null);pkSet(PK_RESULT_KEY,null);})();

document.querySelectorAll('[data-files]').forEach(el=>oh2Upload(el,docs[el.dataset.files],()=>clearErr(el)));

/* ตรวจตอนกดบันทึก (F9) — ช่องที่ data-req ต้องมีค่า · วงเงินต้องเป็นตัวเลขมากกว่า 0 · กล่องเอกสารที่จำเป็นต้องมีอย่างน้อย 1 ไฟล์ */
function setErr(el,msg){el.classList.add('err');const h=el.querySelector('.help');h.textContent=msg;h.classList.remove('hidden');const fu=el.querySelector('.fu');if(fu)fu.classList.add('err')}
function clearErr(el){el.classList.remove('err');const h=el.querySelector('.help');if(h)h.classList.add('hidden');const fu=el.querySelector('.fu');if(fu)fu.classList.remove('err')}
const money=v=>Number(String(v).replace(/,/g,''));
function validate(){
  let first=null;
  document.querySelectorAll('[data-req]').forEach(el=>{
    clearErr(el);
    if(el.dataset.files){if(!docs[el.dataset.files].length){setErr(el,'กรุณาแนบ'+el.querySelector('label').textContent);first=first||el}return}
    const inp=el.querySelector('input,select');const v=inp.value.trim();
    if(!v){setErr(el,'กรุณาระบุ'+el.querySelector('label').textContent);first=first||el;return}
    if(inp.id==='budget'&&!(money(v)>0)){setErr(el,'วงเงินต้องเป็นตัวเลขมากกว่า 0');first=first||el}
  });
  const carsBad=PC.validate();first=first||carsBad;   // ราคากลาง/ราคาประเมินต้องครบทุกคัน (เรียกเสมอ ให้ขึ้นเตือนพร้อมช่องอื่น)
  if(first){first.scrollIntoView({block:'center',behavior:'smooth'});const i=first.querySelector('input:not([type=file]),select');if(i)i.focus()}
  return !first;
}
FIELDS.forEach(f=>$(f).addEventListener('input',()=>clearErr($(f).closest('.f'))));
$('budget').addEventListener('blur',()=>{const n=money($('budget').value);if(n>0)$('budget').value=oh2Money(n)});

function commit(){
  if($('simfail').checked){oh2Notify('general error',{err:true});return false}
  const data={name:$('name').value.trim(),year:+$('year').value,budget:money($('budget').value),wbs:$('wbs').value.trim(),net:$('net').value.trim(),act:$('act').value.trim(),remark:$('remark').value.trim(),cars:carsSnap(),docs};
  if(plan)Object.assign(plan,data);
  else S.plans.push(Object.assign({id:oh2NextPlanId(S),created:new Date().toISOString().slice(0,10),pos:[]},data));
  oh2Save(S);return true;
}
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  if(!validate())return;
  if(plan){
    if(!dirty()){location.href=backTo;return}            // ไม่มีการแก้ไข → ไม่มี cf change
    $('m-edit-s').textContent=`บันทึกการเปลี่ยนแปลงของแผน ${plan.id} "${$('name').value.trim()}"`;
    oh2Modal('m-edit',true);return;
  }
  if(commit())location.href='overhaul-v2-01-plans.html?saved=create';
});
$('m-edit-ok').addEventListener('click',()=>{oh2Modal('m-edit',false);if(commit())location.href=backTo+(backTo.includes('?')?'&':'?')+'saved=edit'});

/* ย้อนกลับ / ยกเลิก — มีการแก้ไขเท่านั้นถึงถาม */
const leave=()=>{if(dirty())oh2Modal('m-leave',true);else location.href=backTo};
$('back').addEventListener('click',leave);$('cancel').addEventListener('click',leave);
$('m-leave-ok').addEventListener('click',()=>{location.href=backTo});
</script>
</body>
</html>
