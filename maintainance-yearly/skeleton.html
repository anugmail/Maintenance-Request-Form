      '<b>รูปถ่ายก่อน/หลัง</b> — บังคับกี่รูป ข้ามได้ไหม ถ้าข้ามต้องให้เหตุผลไหม',

  { no:4, id:'inspect', label:'ตรวจรับ', who:'กบค.',
    what:'<b>ตรวจรับงาน</b>ที่ทำไปแล้ว และคืนของที่ไม่ได้ใช้',
    inp:'บันทึกงานจากเฟส 3', out:'ผลตรวจรับ + รายการคืนอะไหล่',
    does:[
      'กบค. <b>ตรวจสอบข้อมูลการบำรุงรักษา</b>',
      '<b>ไม่ผ่าน</b> → ตรวจสอบสาเหตุ → แก้ไขได้ก็แก้ · <b>แก้ไม่ได้ → ขออนุมัติปรับลดงาน</b>',
      '<b>ผ่าน</b> → ผู้รับจ้าง/กบค. <b>คืนอะไหล่-น้ำมันที่ไม่ได้ใช้</b>'
    ],
    asks:[
      '<b>"ขออนุมัติปรับลดงาน" ใครอนุมัติ</b> — ฝ่ายพัสดุ (เจ้าของเลขงาน) หรือผู้บังคับบัญชา กบค.',
      'ตรวจรับ<b>รายคัน</b>หรือ<b>ทั้งแผนรวดเดียว</b>',
      'คืนอะไหล่ — ตัดยอดคลังกลับอัตโนมัติไหม (ต้นแบบแจ้งซ่อมยังไม่ตัดสต็อกจริง — จุดนี้เหมือนกันไหม)'
    ]},

  { no:5, id:'report', label:'จัดทำรายงาน', who:'กบค. → ผู้บังคับบัญชา กบค.',
    what:'สรุปผล ตรวจสภาพ และ<b>ให้ผู้บังคับบัญชาอนุมัติปิดงาน</b>',
    inp:'ผลตรวจรับจากเฟส 4', out:'งานปิด (ผ่านการตรวจของผู้บังคับบัญชา)',
    does:[
      'กบค. <b>ตรวจสภาพการทำงาน</b> — ไฟฟ้า / น้ำมัน / ไฮดรอลิก',
      '<b>บันทึกผลตรวจน้ำมันไฮดรอลิก</b>ลงในใบงาน',
      '<b>ส่ง Noti ผลตรวจน้ำมัน</b>ให้เจ้าของรถ',
      'มีอะไหล่เหลือ → <b>ทำเรื่องคืนคลัง</b> · ครบแล้ว → บำรุงรักษาครบทุกคันตามแผน',
      '<b>ผู้บังคับบัญชา กบค. ตรวจสอบประวัติงาน</b> → ผ่าน = ปิดงาน · ไม่ผ่าน = ตีกลับให้แก้'
    ],

      '<b>ผู้บังคับบัญชา กบค. คือระดับไหน</b> — ผอ.กอง / ผช.ผอ. / อื่น',

  { no:6, id:'cost', label:'คำนวณต้นทุน', who:'ระบบ / กบค.',

    does:[

    ],
    asks:[
      '<b>สูตร SUM ต้นทุน</b> — รวมอะไรบ้าง คิดต่อคันหรือต่อแผน (ค้างมาจากรอบก่อน)',
      'ราคาอะไหล่ใช้ราคาไหน — ราคาเบิกจากคลัง หรือราคามาตรฐาน',
      'ต้นทุนนี้<b>ต่อยอดไปหน้าประเมินความคุ้มค่า</b>ของฝั่งแจ้งซ่อมไหม'
    ]},

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/</g,'&lt;');
let cur = 1;

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2200); }

function renderStepper(){
  $('stepper').innerHTML = `<div class="wsteps">${PHASES.map(p=>{
    const cls = p.no===cur ? 'active' : p.no<cur ? 'passed' : '';
    return `<div class="wstep ${cls}" onclick="go(${p.no})" title="${p.label}">
      <span class="num">${p.no<cur?'✓':p.no}</span><span class="lbl">${p.label}</span></div>`;
  }).join('')}</div>`;
}

function renderPhase(){
  const p = PHASES.find(x=>x.no===cur);
  $('crumb').textContent = p.label;
  $('ptitle').textContent = `เฟส ${p.no} · ${p.label}`;
  $('who').textContent = p.who;

  $('phase').innerHTML = `
    <div class="card">
      <h2>หน้านี้คืออะไร</h2>
      <div class="sub">${p.what}</div>
      <dl class="kv">
        <dt>ใครทำ</dt><dd>${esc(p.who)}</dd>
        <dt>รับอะไรเข้ามา</dt><dd>${p.inp}</dd>
        <dt>ส่งอะไรออกไป</dt><dd>${p.out}</dd>
      </dl>
    </div>

    <div class="card">
      <h2>ทำอะไรบ้างในหน้านี้</h2>
      <div class="sub">ลำดับตาม <code>Diagram/01-บำรุงรักษาตามวาระ/0${p.no}-*.md</code></div>
      <ol class="does">${p.does.map(d=>`<li>${d}</li>`).join('')}</ol>
      <div class="skel">
        <span class="ms">dashboard_customize</span>
        พื้นที่หน้าจอจริงของเฟสนี้ — <b>ยังว่าง</b><br>
        จะค่อยๆ ใส่ทีละส่วนหลังเคาะเงื่อนไขด้านล่าง
      </div>
    </div>

    <div class="card">
      <h2>🔧 เงื่อนไขที่ต้องเคาะก่อนลงมือ <span class="badge b-low">${p.asks.length} ข้อ</span></h2>
      <div class="sub">ตอบทีละข้อได้ ตอบแล้วผมจะบันทึกลง <code>plan.md</code> + อัปเดตผัง mermaid ให้ตรงกัน</div>
      <ul class="asks">${p.asks.map((a,i)=>`<li><b>${p.no}.${i+1}</b> — ${a}</li>`).join('')}</ul>
    </div>

    <div class="navrow">
      <button class="btn btn-s" onclick="go(${p.no-1})" ${p.no===1?'disabled':''}>
        <span class="ms">arrow_back</span>ย้อนกลับ</button>
      <span class="sp"></span>
      <span class="sub" style="margin:0">เฟส ${p.no} จาก ${PHASES.length}</span>
      <button class="btn btn-p" onclick="go(${p.no+1})" ${p.no===PHASES.length?'disabled':''}>
        ถัดไป<span class="ms">arrow_forward</span></button>
    </div>`;
}

function go(n){
  if(n<1||n>PHASES.length) return;
  cur = n; location.hash = '#' + n;
  renderStepper(); renderPhase(); window.scrollTo({top:0,behavior:'smooth'});
}

function boot(){
  const h = parseInt((location.hash||'').replace('#',''),10);
  cur = (h>=1 && h<=PHASES.length) ? h : 1;
  renderStepper(); renderPhase();
}
window.addEventListener('hashchange', boot);
boot();
</script>
